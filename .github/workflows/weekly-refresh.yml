name: Weekly discovery (new hotels)

# Grows the catalogue only: discovers NEW hotels on a schedule and builds a
# page for each (discover -> research -> summaries), then commits. It
# deliberately does NOT run the "refresh existing entities" maintenance pass,
# so existing hotels -- including their hand-set guest scores -- are left
# untouched. Research and summaries only act on entities that need them (the
# newly discovered ones): research skips anything researched in the last
# researchIntervalDays, and summaries only touches entities still carrying
# the pending-summary placeholder. Supports a manual on-demand run from the
# Actions tab.
#
# Deviation from the races engine (see site.config.json's `notes` field --
# this is a deliberate, explicit product decision for this vertical, not an
# oversight): this workflow commits straight to `main` when both the
# pre-run and post-run `npm run validate` pass, instead of opening a PR for
# human review like races does. A push to `main` is what deploy.yml watches,
# so a clean validated run goes live automatically, same day.
#
# This means schema validation is the ONLY gate on this vertical's content --
# there is no human read-through before publish. Validation catches
# structural problems (missing required fields, bad enums, broken
# cross-references) but cannot catch a factually wrong `core_facts` value or
# a hallucinated detail in an `ai_summary` that happens to be well-formed
# JSON. If that risk profile stops being acceptable, switch back to opening
# a PR (see the races repo's weekly-refresh.yml for the reference
# implementation) rather than auto-committing.
on:
  schedule:
    - cron: '0 3 * * 1' # every Monday, 03:00 UTC
  workflow_dispatch: {}

concurrency:
  group: weekly-refresh
  cancel-in-progress: false # never cancel a run that's mid-way through writing data files

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # See deploy.yml for why this isn't `cache: npm` yet (no lockfile
          # committed until a real `npm install` has been run once).

      - name: Install dependencies
        run: npm install

      - name: Validate data (pre-flight)
        run: npm run validate
        # If data/ is already broken before this run even starts, stop here
        # rather than layering AI-generated changes on top of a known-bad
        # state. Fix the underlying data and re-run manually.

      - name: Discover new entities
        run: npm run discover
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Research entities on the web
        run: npm run research
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Gathers first-hand commentary (quotes, highlights, caveats,
        # sentiment) that the aggregator sources don't carry, so the summary
        # step below has something to write from beyond date/distance/venue.
        # Rate-limited by sourceConfig.researchPerRunLimit and only re-runs
        # an entity after researchIntervalDays, so weekly cost stays flat
        # rather than scaling with the size of the directory.

      - name: Generate AI summaries
        run: npm run summaries
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Validate data (post-run)
        run: npm run validate
        # If discover/research/summaries produced anything schema-invalid,
        # duplicate, or cross-reference-broken, fail the whole job here.
        # No PR gets opened from a run that ends in known-bad data -- you'll
        # see a red X in Actions instead, which is the correct failure mode.

      - name: Check for changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push refreshed data to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): weekly discover + build new hotels [automated]"
          git push origin HEAD:main
        # Both pre- and post-run `npm run validate` passed at this point, so
        # every changed file is schema-valid and cross-reference-clean --
        # that's the gate this vertical uses instead of human PR review (see
        # the comment block at the top of this file). This push to `main` is
        # what triggers deploy.yml, so the site goes live from this step.

      - name: No changes this run
        if: steps.diff.outputs.changed == 'false'
        run: echo "Pipeline ran; nothing changed in data/, nothing committed."
