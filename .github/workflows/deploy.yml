name: Deploy to GitHub Pages

# Builds the Astro site and publishes it to GitHub Pages on every push to
# main, plus lets you trigger a manual rebuild/redeploy from the Actions tab
# without needing a new commit (useful right after changing a GitHub secret,
# or after the weekly-refresh workflow commits new data).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Allow one concurrent deployment; if a new push lands while a build is
# still running, cancel the in-progress one rather than queueing (we always
# want the latest commit live, not every intermediate one).
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # No package-lock.json is committed yet (this repo has never had
          # `npm install` run against a real registry -- see README's "Known
          # decisions" section), so there's nothing for actions/setup-node's
          # npm cache to key off. Once a lockfile exists, add
          # `cache: npm` back here for faster builds.

      - name: Install dependencies
        run: npm install

      - name: Build
        # Builds at the domain root -- public/CNAME points GitHub Pages at
        # runsea.run, so no base-path prefix is needed. (The temporary
        # PREVIEW_BASE_PATH override used before the domain cutover has been
        # removed, along with its branch in astro.config.mjs.)
        run: npm run build

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Tells Bing (and Yandex/Seznam/Naver -- one shared endpoint) about
      # changed URLs immediately rather than waiting for a recrawl. Google
      # doesn't participate in IndexNow and is unaffected: it keeps finding
      # pages via sitemap.xml exactly as before.
      #
      # Worth having because ChatGPT's search is Bing-backed, so being
      # missing from Bing costs a whole class of AI answers.
      #
      # Runs AFTER deploy-pages and reads the LIVE sitemap (--sitemap-url)
      # rather than a rebuilt dist/, so a URL is only ever submitted once
      # it's genuinely served -- and CI doesn't rebuild to regenerate a file
      # the site already serves. Needs no `npm install`: the script's only
      # import is src/lib/config.js, which just reads site.config.json.
      #
      # continue-on-error because a refused ping is not a broken deploy --
      # the site is live either way. The script itself also exits 0 on every
      # expected failure (no key configured, sitemap unreachable, API
      # refusal); this is belt-and-braces so a crash can't red-X a good
      # deploy either.
      - name: Checkout (for the IndexNow script)
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ping IndexNow with changed URLs
        continue-on-error: true
        run: node scripts/submit-indexnow.js --sitemap-url "https://elitestay.travel/sitemap.xml"
